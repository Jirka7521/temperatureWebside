<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meteorologický panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
    <link rel="icon" href="Icon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="Icon.ico" type="image/x-icon">
</head>
<body class="bg-light">

    <!--
        TOP NAVIGATION BAR (desktop only — hidden on mobile via d-none d-md-flex)
        Contains: page links (left) | dark-mode toggle (centre) | chart mode (right)
    -->
    <nav class="top-nav d-none d-md-flex">
        <!-- Left: page navigation -->
        <div class="top-nav-section top-nav-left">
            <a href="index.html" class="top-tab-btn active">Dashboard</a>
            <a href="data.html"  class="top-tab-btn">Data</a>
        </div>

        <!-- Centre: dark-mode toggle -->
        <div class="top-nav-section top-nav-center">
            <button id="themeButtonDesktop"
                    class="btn btn-sm btn-ghost"
                    aria-label="Přepnout tmavý režim"
                    title="Přepnout tmavý režim">
                <span id="themeIconDesktop" class="theme-icon" aria-hidden="true"></span>
            </button>
        </div>

        <!-- Right: chart-mode toggle (24 h / 7 d) -->
        <div class="top-nav-section top-nav-right">
            <button id="chartDay"  class="btn chart-mode-btn active" aria-pressed="true">24 hodin</button>
            <button id="chartWeek" class="btn chart-mode-btn"        aria-pressed="false">7 dní</button>
        </div>
    </nav>

    <!-- Dashboard — fills the remaining viewport height below the nav -->
    <div class="container-fluid p-3 dashboard-rows">

        <!-- Row 1: Indoor Temperature & Outdoor Weather cards -->
        <div class="row row-grow-1 g-3 mb-2">

            <!-- Indoor card -->
            <div class="col-12 col-md-6 d-flex">
                <div class="card text-center shadow flex-fill">
                    <div class="card-body">
                        <div class="responsive-title">Vnitřní teplota</div>
                        <div class="temp-humidity-container">
                            <div class="text-center">
                                <div class="responsive-value" id="temperature">--°C</div>
                                <div class="text-muted">Teplota</div>
                            </div>
                            <div class="text-center">
                                <div class="responsive-value" id="humidity">--%</div>
                                <div class="text-muted">Vlhkost</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Outdoor card -->
            <div class="col-12 col-md-6 d-flex">
                <div class="card text-center shadow flex-fill">
                    <div class="card-body">
                        <div class="responsive-title">Venkovní počasí</div>
                        <div class="forecast-container">
                            <div class="temp-humidity-container">
                                <div class="text-center">
                                    <div class="responsive-value" id="outdoor-temperature">--°C</div>
                                    <div class="text-muted">Teplota</div>
                                </div>
                                <div class="text-center">
                                    <div class="responsive-value" id="outdoor-temperature-1h">--°C</div>
                                    <div class="text-muted">Za 1 hod</div>
                                </div>
                            </div>
                            <div class="rain-forecast" id="rain-forecast">Žádná data o srážkách</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Row 2: Status card -->
        <div class="row g-2 mb-2 status-row">
            <div class="col-12">
                <div class="card shadow-sm status-card">
                    <div class="card-body d-flex flex-column flex-md-row align-items-center gap-2">

                        <!-- Current time (desktop only) -->
                        <div id="current-time"
                             class="status-text flex-grow-1 text-center text-md-start d-none d-md-block">
                            Načítání aktuálního času…
                        </div>

                        <!-- Dark-mode toggle: mobile only (desktop version is in top nav) -->
                        <div class="d-flex d-md-none align-items-center justify-content-center">
                            <button id="themeButton"
                                    class="btn btn-sm btn-ghost"
                                    aria-label="Přepnout tmavý režim"
                                    title="Přepnout tmavý režim">
                                <span id="themeIcon" class="theme-icon" aria-hidden="true"></span>
                            </button>
                        </div>

                        <!-- Time since last refresh -->
                        <div id="time-since"
                             class="status-text flex-grow-1 text-center text-md-end">
                            Načítání informací o aktualizaci…
                        </div>

                    </div>
                </div>
            </div>
        </div>

        <!-- Row 3: Weather chart (desktop only) -->
        <div class="row row-grow-3 g-3 d-none d-md-flex">
            <div class="col-12 d-flex">
                <div class="card shadow flex-fill">
                    <div class="card-body">
                        <div class="chart-container">
                            <canvas id="weatherChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div><!-- .dashboard-rows -->

    <!-- Bootstrap JS bundle (with Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3"></script>

    <!--
        Script load order (important):
        1. darkmode.js  — applies theme class before first render
        2. config.js    — sets window.inlineConfig
        3. getValues.js — dashboard controller, exposes window.configPromise
        4. chartSetup.js — depends on Chart.js and window.configPromise
    -->
    <script src="darkmode.js"></script>
    <script src="config.js"></script>
    <script src="getValues.js"></script>
    <script src="chartSetup.js"></script>

</body>
</html>
