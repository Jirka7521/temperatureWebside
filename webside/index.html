<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meteorologický panel</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
    <!-- Favicon -->
    <link rel="icon" href="Icon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="Icon.ico" type="image/x-icon">
</head>
<body class="bg-light">

    <!-- ═══════════════════════════════════════════════════════════════════════
         TOP NAVIGATION BAR
         Visible on desktop (≥ md / 768 px) only.  Hidden on mobile — the
         compact status bar inside the dashboard serves that role instead.
         ═══════════════════════════════════════════════════════════════════════ -->
    <!-- Navbar layout: [start: brand + links] | [center: theme toggle] | [end: chart buttons] -->
    <nav class="top-navbar d-none d-md-flex align-items-center"
         id="topNav" aria-label="Hlavní navigace">

        <!-- LEFT: brand and page navigation links -->
        <div class="top-navbar-start">
            <a href="index.html" class="top-navbar-brand">Meteorologický panel</a>
            <div class="top-navbar-divider" aria-hidden="true"></div>
            <ul class="top-navbar-nav" role="list">
                <li>
                    <a href="index.html" class="top-nav-link top-nav-link--active"
                       aria-current="page">Přehled</a>
                </li>
                <li>
                    <a href="data.html" class="top-nav-link">Data</a>
                </li>
            </ul>
        </div>

        <!-- CENTRE: dark / light mode toggle (visually centred by equal flex:1 on siblings) -->
        <div class="top-navbar-center">
            <button class="btn btn-ghost theme-btn"
                    aria-label="Přepnout tmavý/světlý režim"
                    title="Přepnout tmavý/světlý režim">
                <span class="theme-icon" aria-hidden="true"></span>
            </button>
        </div>

        <!-- RIGHT: chart-mode toggle (24 h / 7 d).
             Button IDs are referenced by chartSetup.js — do not rename. -->
        <div class="top-navbar-end">
            <button id="chartDay"  class="btn chart-mode-btn active" aria-pressed="true">24 hod</button>
            <button id="chartWeek" class="btn chart-mode-btn"        aria-pressed="false">7 dní</button>
        </div>

    </nav>

    <!-- Main Container -->
    <div class="container-fluid p-3 dashboard-rows">

        <!-- Status card moved below temperature tiles (kept for later insertion) -->

        <!-- Row 2: Indoor Temperature & Humidity and Outdoor Temp & Rain Forecast -->
        <div class="row row-grow-1 g-3 mb-2">
            <!-- Indoor Temperature & Humidity Card -->
            <div class="col-12 col-md-6 d-flex">
                <div class="card text-center shadow flex-fill">
                    <div class="card-body">
                        <div class="responsive-title">Vnitřní teplota</div>
                        <div class="temp-humidity-container">
                            <!-- Temperature -->
                            <div class="text-center">
                                <div class="responsive-value" id="temperature">--°C</div>
                                <div class="text-muted">Teplota</div>
                            </div>
                            <!-- Humidity -->
                            <div class="text-center">
                                <div class="responsive-value" id="humidity">--%</div>
                                <div class="text-muted">Vlhkost</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Outdoor Weather Card -->
            <div class="col-12 col-md-6 d-flex">
                <div class="card text-center shadow flex-fill">
                    <div class="card-body">
                        <div class="responsive-title">Venkovní počasí</div>
                        <div class="forecast-container">
                            <div class="temp-humidity-container">
                                <!-- Outdoor Temperature -->
                                <div class="text-center">
                                    <div class="responsive-value" id="outdoor-temperature">--°C</div>
                                    <div class="text-muted">Teplota</div>
                                </div>
                                <!-- Outdoor 1-hour forecast temperature -->
                                <div class="text-center">
                                    <div class="responsive-value" id="outdoor-temperature-1h">--°C</div>
                                    <div class="text-muted">Za 1 hod</div>
                                </div>
                            </div>
                            <!-- Rain Forecast (separate row below the two values) -->
                            <div class="rain-forecast" id="rain-forecast">Žádná data o srážkách</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- Row 2b: Full-width Status Card (between temps and chart) -->
        <div class="row g-2 mb-2 status-row">
            <div class="col-12">
                <div class="card shadow-sm status-card">
                    <div class="card-body d-flex flex-column flex-md-row align-items-center gap-2">
                        <div id="current-time" class="status-text flex-grow-1 text-center text-md-start d-none d-md-block">Načítání aktuálního času…</div>

                        <!-- Mobile-only controls: theme toggle.
                             On desktop these controls live in the top navbar.
                             Chart mode buttons are not needed on mobile because
                             the chart is hidden there. -->
                        <div class="d-flex d-md-none align-items-center gap-2 justify-content-center">
                            <div class="theme-toggle d-flex justify-content-center" style="align-items:center;">
                                <button class="btn btn-sm btn-ghost theme-btn"
                                        aria-label="Přepnout tmavý režim"
                                        title="Přepnout tmavý režim">
                                    <span class="theme-icon" aria-hidden="true"></span>
                                </button>
                            </div>
                        </div>

                        <div id="time-since" class="status-text flex-grow-1 text-center text-md-end">Načítání informací o aktualizaci…</div>
                    </div>
                </div>
            </div>
        </div>

    <!-- Row 3: Weather Chart (full width) -->
    <div class="row row-grow-3 g-3 d-none d-md-flex">
            <div class="col-12 d-flex">
                <div class="card shadow flex-fill">
                    <div class="card-body">
                        <div class="chart-container">
                            <!-- Weather Chart Canvas -->
                            <canvas id="weatherChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- Bootstrap JS Bundle (with Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Chart.js Library -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3"></script>
    <!-- Custom JS Files -->
    <!--
        Script load order is important:
        2) darkmode.js - toggles theme class used by CSS variables
        3) config.js - must set `window.inlineConfig` before panels initialize
        4) getValues.js - dashboard controller and ConfigManager
        5) chartSetup.js - depends on `window.configData` and Chart.js
    -->
    <script src="darkmode.js"></script>
    <script src="config.js"></script>
    <script src="getValues.js"></script>
    <script src="chartSetup.js"></script>
    <!-- Flash logic moved into getValues.js -->
</body>
</html>
